pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    upstream api { server api:3000; }
    upstream frontend { server frontend:3001; }
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # No query strings, authorization headers or email verification tokens in logs.
    map $uri $safe_uri { ~^/invite/ /invite/redacted; default $uri; }
    log_format safe '$remote_addr $request_method $safe_uri $status req_id=$request_id';
    access_log /dev/stdout safe;
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    server {
        listen 8080;
        server_name _;
        client_max_body_size 10M;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        location /api/ { proxy_pass http://api; }
        location /socket.io/ {
            proxy_pass http://api;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
        location = /health { proxy_pass http://api/api/v1/health; }
        location / {
            proxy_pass http://frontend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
