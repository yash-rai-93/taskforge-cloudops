# Preparation only: frontend service, dedicated worker build, HTTPS and full CD
# remain Docker/CI phase dependencies. These names are not verified published.
x-api-image: &api-image
  image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE}-api:${API_IMAGE_TAG:?Set API_IMAGE_TAG to a full commit SHA}

x-worker-image: &worker-image
  image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE}-worker:${WORKER_IMAGE_TAG:?Set WORKER_IMAGE_TAG to a full commit SHA}

# Planned image contract; deliberately no frontend service until its Dockerfile exists.
x-frontend-image:
  image: ${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE}-frontend:${FRONTEND_IMAGE_TAG:?Set FRONTEND_IMAGE_TAG to a full commit SHA}

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: "3000"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
  DB_NAME: ${DB_NAME:?Set DB_NAME}
  DB_SSL: "false"
  DB_SSL_REJECT_UNAUTHORIZED: "true"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
  REDIS_TLS: "false"
  JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_ID_PRO: ${STRIPE_PRICE_ID_PRO:-}
  STRIPE_PRICE_ID_ENTERPRISE: ${STRIPE_PRICE_ID_ENTERPRISE:-}
  FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL to your public HTTPS origin}
  SMTP_HOST: ${SMTP_HOST:-localhost}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-TaskForge <noreply@example.com>}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    <<: *api-image
    command: ["node", "dist/run-migrations.js"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    command: ["node", "dist/main"]
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  worker:
    <<: *worker-image
    command: ["node", "dist/worker"]
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
