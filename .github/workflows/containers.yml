name: Container verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  images:
    name: Build ${{ matrix.role }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: api
            context: backend
            file: backend/Dockerfile
          - role: worker
            context: backend
            file: backend/Dockerfile.worker
          - role: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image namespace
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "namespace=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build once and export for integration and publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          tags: |
            taskforge-local-${{ matrix.role }}:latest
            ${{ steps.image.outputs.namespace }}-${{ matrix.role }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.role }}.tar
          cache-from: type=gha,scope=${{ matrix.role }}
          cache-to: type=gha,scope=${{ matrix.role }},mode=max
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image-${{ matrix.role }}
          path: ${{ runner.temp }}/${{ matrix.role }}.tar
          retention-days: 1
          compression-level: 0
          overwrite: true
          if-no-files-found: error
  compose:
    name: Full-stack Compose smoke test
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: taskforge-ci-${{ github.run_id }}
      COMPOSE_SMOKE_TEST: 'true'
      FRONTEND_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tested-image-*
          path: images
          merge-multiple: true
      - name: Load the exact three images to be published
        run: |
          for role in api worker frontend; do docker load -i "images/$role.tar"; done
          docker compose config --quiet
      - name: Set disposable test state path
        run: echo "SMOKE_STATE_FILE=$RUNNER_TEMP/taskforge-smoke.json" >> "$GITHUB_ENV"
      - name: Start complete application
        id: stack
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Verify connectivity, jobs, persistence and crash recovery
        run: node scripts/compose-smoke.mjs
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-smoke" playwright@1.65.0 --no-audit --no-fund
          "$RUNNER_TEMP/browser-smoke/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify actual browser frontend
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-smoke/node_modules/playwright
        run: node scripts/compose-browser.cjs
      - name: Verify production Compose and deployment rollback
        if: ${{ always() && !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          node scripts/compose-production-smoke.mjs
          python3 scripts/deployment-smoke.py
      - name: Bounded diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 60 api worker migrate frontend nginx mailpit
      - name: Remove disposable containers and data
        if: always()
        run: |
          docker compose down -v --remove-orphans
          rm -f "$SMOKE_STATE_FILE"
