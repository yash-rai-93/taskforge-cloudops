name: AWS infrastructure checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/aws/**'
      - '.github/workflows/infrastructure.yml'
  push:
    branches: [main]
    paths:
      - 'infra/aws/**'
      - '.github/workflows/infrastructure.yml'

permissions:
  contents: read

jobs:
  terraform:
    name: Validate Terraform and bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - name: Review plans with a mocked AWS provider
        run: terraform test -verbose -no-color
      - name: Check bootstrap disk safety
        run: |
          bash -n bootstrap.sh
          bash tests/bootstrap-test.sh
