name: CI and release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  # Never interrupt a main release/deployment halfway through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm audit --audit-level=high
      - run: npm test -- --runInBand
      - run: npm run build
      - run: node scripts/verify-build.mjs
      - run: node scripts/verify-config.cjs
  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ''
          NEXT_PUBLIC_SOCKET_URL: ''
  automation:
    name: Workflow and deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test release validation and rollback decisions
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check workflows
        # Official actionlint image pinned to a digest in the companion lock file.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$(cat .github/actionlint-image)" -color
      - name: Check deployment shell syntax
        run: |
          for script in scripts/deploy.sh scripts/rollback.sh scripts/deploy-remote.sh; do bash -n "$script"; done
  containers:
    name: Container verification
    uses: ./.github/workflows/containers.yml
  publish:
    name: Publish tested release
    needs: [backend, frontend, automation, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tested-image-*
          path: images
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and resolve all three image digests
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/publish.py --images images --digests "$RUNNER_TEMP/digests.json"
      - name: Create digest-pinned deployment bundle
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/release.py --repository "$REPOSITORY" --commit "$RELEASE_SHA" --digests "$RUNNER_TEMP/digests.json" --output "$RUNNER_TEMP/release"
          tar -czf "$RUNNER_TEMP/taskforge-release.tar.gz" -C "$RUNNER_TEMP/release" .
          (cd "$RUNNER_TEMP" && sha256sum taskforge-release.tar.gz > taskforge-release.tar.gz.sha256)
          cat "$RUNNER_TEMP/release/release.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: taskforge-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/taskforge-release.tar.gz
            ${{ runner.temp }}/taskforge-release.tar.gz.sha256
          retention-days: 30
          overwrite: true
          if-no-files-found: error
  deploy:
    name: Deploy production
    needs: publish
    # Deliberate opt-in: no host or credentials are assumed before AWS provisioning.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: taskforge-release-${{ github.sha }}
          path: release-artifact
      - name: Transfer verified bundle and deploy over pinned SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/deploy-remote.sh release-artifact
